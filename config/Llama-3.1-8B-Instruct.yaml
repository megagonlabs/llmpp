model_args:
  pretrained_model_name_or_path: "models/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"

tokenizer_args:
  pretrained_model_name_or_path: null  # defaults to model.model_name_or_path
  pad_token: "<|finetune_right_pad_id|>"  # see https://www.llama.com/docs/model-cards-and-prompt-formats/llama3_1/#-special-tokens-

collator_args:
  response_template: "<|start_header_id|>assistant<|end_header_id|>\n\n"
  instruction_template: "<|start_header_id|>user<|end_header_id|>"
  mlm: false

dataset_args:
  train_jsonl_path: "data/en_ewt-r2.15/en-turn1-step3.train.jsonl"
  replace_system_role: false

sft_config_args:
  output_dir: null  # defaults to {model.model_name_or_path}_trl[-lora]_{dataset.train_jsonl_path#stem}
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  num_train_epochs: 3
  learning_rate: 3.0e-4
  save_strategy: "no"
  logging_steps: 0.01
  # eval_steps: 0.25
  eval_strategy:  "no"
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  bf16: true
  max_seq_length: 8192

lora_args:
  use_lora: true
  target_modules: "all-linear"
  r: 8
  lora_dropout: 0.05
  task_type: "CAUSAL_LM"

chat_template_replace_pattern:
  pattern: "^\\{\\{- bos_token \\}\\}\\n"
  repl: ""
