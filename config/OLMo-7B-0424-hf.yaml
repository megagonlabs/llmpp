model_args:
  pretrained_model_name_or_path: "models/OLMo-7B-0424-hf"
  torch_dtype: "bfloat16"
  pad_token_id: 0

tokenizer_args:
  pretrained_model_name_or_path: null  # defaults to model.model_name_or_path
  pad_token: "<|padding|>"
  chat_template: "{{ bos_token }}{% if messages[0]['role'] == 'system' %}{{ raise_exception('System role not supported') }}{% endif %}{% for message in messages %}{% if (message['role'] == 'user') != (loop.index0 % 2 == 0) %}{{ raise_exception('Conversation roles must alternate user/assistant/user/assistant/...') }}{% endif %}{% if (message['role'] == 'assistant') %}{% set role = 'model' %}{% else %}{% set role = message['role'] %}{% endif %}{{ 'header: ' + role + '\n' + message['content'] | trim + '\n\n' }}{% endfor %}{% if add_generation_prompt %}{{'header: model\n'}}{% else %}{{ eos_token }}{% endif %}"

collator_args:
  response_template: [10146, 27, 1566, 187]  # "header: model\n"
  instruction_template: [10146, 27, 2608, 187]  # "header: user\n"
  mlm: false

dataset_args:
  train_jsonl_path: "data/en_ewt-r2.15/en-tabular-step2-no-orth.train.jsonl"
  replace_system_role: true

sft_config_args:
  output_dir: null  # defaults to {model.model_name_or_path}_trl[-lora]_{dataset.train_jsonl_path#stem}
  per_device_train_batch_size: 3
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  num_train_epochs: 3
  learning_rate: 1.0e-4
  save_strategy: "no"
  logging_steps: 0.01
  # eval_steps: 0.25
  eval_strategy:  "no"
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  bf16: true
  max_seq_length: 4096

lora_args:
  use_lora: true
  target_modules: "all-linear"
  r: 8
  lora_dropout: 0.05
  task_type: "CAUSAL_LM"

#chat_template_replace_pattern:
#  pattern: "^\\{\\{ bos_token \\}\\}"
#  repl: ""

post_process: [
  "merge_lora_weights"
]
