model_args:
  device_map: "auto"
  pretrained_model_name_or_path: "models/gemma-2-27b-it-unsloth"
  dtype: "bfloat16"
  load_in_8bit: true
  attn_implementation: "eager"

tokenizer_args:
  pretrained_model_name_or_path: null  # defaults to model.model_name_or_path
  # pad_token: "<pad>"  # should use pad_token defined in the tokenizer
  padding_side: "right"

collator_args:
  response_template: "<start_of_turn>model\n"
  instruction_template: "<start_of_turn>user\n"
  mlm: false

dataset_args:
  train_jsonl_path: "data/en_ewt-r2.15/en-turn1-step3.train.jsonl"
  replace_system_role: true  # gemma-2 does not support system role

sft_config_args:
  output_dir: null  # defaults to {model.model_name_or_path}_trl[-lora]_{dataset.train_jsonl_path#stem}
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  num_train_epochs: 3
  learning_rate: 3.0e-4
  save_strategy: "no"
  logging_steps: 0.01
  # eval_steps: 0.25
  eval_strategy:  "no"
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  bf16: true
  max_seq_length: 8192

lora_args:
  use_lora: true
  target_modules: "all-linear"
  r: 16
  alpha: 16
  lora_dropout: 0.05

unsloth_args:
  chat_template: "gemma2"
  train_on_responses_only:
    instruction_part: "<start_of_turn>user\n"
    response_part: "<start_of_turn>model\n"
