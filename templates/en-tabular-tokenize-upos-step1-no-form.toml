add_whitespace = "after"

[[message_template]]
role = "system"
content = """
You are a linguist and specialize in dependency parsing based on Universal Dependencies."""

[[message_template]]
role = "user"
content = """
We will now perform dependency parsing on <<<LANGUAGE>>> sentence.

First, as tokenization, split the input sentence into words with the word indexes from 1 in TSV format, and add the fields of UPOS.

Then, as dependency parsing, create a new TSV with four fields: word index + UPOS + the dependent word index + the Universal Dependencies relation.
However, for the word that is the main predicate of the sentence, the dependent word index should be 0.

input sentence:
<<<SENTENCE>>>
"""

[[message_template]]
role = "assistant"
content = """
tokenization:

<<<TOKEN_TSV:INDEX_ORTHWS_UPOS>>>

dependency parsing:

<<<TOKEN_TSV:INDEX_UPOS_HEAD_LABEL>>>
"""
