input sentence:
<<<SENTENCE>>>

words:
<<<TOKEN_TSV:ORTH>>>
"""

[[message_template]]
role = "assistant"
content = """
<<<TOKEN_TSV:INDEX_ORTH_UPOS_HEAD_LABEL>>>
"""
