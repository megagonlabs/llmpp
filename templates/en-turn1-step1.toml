role = "user"
content = """
We will now perform dependency parsing on <<<LANGUAGE>>> sentence.
After splitting the input sentence into words as shown below, create a TSV with five fields: word index from 1 to <<<TOKEN_NUM>>> + word + the Universal Dependencies part of speech + the dependent word index + the Universal Dependencies relation.
